# Android APK 打包流程
#
# 按约定：此 workflow 仅手动触发（workflow_dispatch），
# 不会在 push/PR 时自动运行。
# 触发方式：GitHub 仓库 → Actions → Android CI → Run workflow，
# 或命令行：gh workflow run android.yml

name: Android CI

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: false
        default: 'both'
        type: choice
        options:
          - debug
          - release
          - both

jobs:
  build:
    name: Build APK (${{ github.event.inputs.build_type || 'both' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: ./mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        run: npm ci || npm install

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        working-directory: ./mobile/android
        run: chmod +x gradlew

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == ''
        working-directory: ./mobile/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == ''
        working-directory: ./mobile/android
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/Maozi-Ip-Scan-debug.apk

      - name: Upload Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == ''
        uses: actions/upload-artifact@v4
        with:
          name: Maozi-Ip-Scan-debug
          path: mobile/android/app/build/outputs/apk/debug/Maozi-Ip-Scan-debug.apk
          retention-days: 30

      # Release 使用 debug 签名（app/build.gradle 中配置），
      # 产物可直接安装；正式发布签名时再接入 secrets。
      - name: Build Release APK
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == ''
        working-directory: ./mobile/android
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename Release APK
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == ''
        working-directory: ./mobile/android
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/Maozi-Ip-Scan-release.apk

      - name: Upload Release APK
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event.inputs.build_type == ''
        uses: actions/upload-artifact@v4
        with:
          name: Maozi-Ip-Scan-release
          path: mobile/android/app/build/outputs/apk/release/Maozi-Ip-Scan-release.apk
          retention-days: 90
