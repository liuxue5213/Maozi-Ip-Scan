# 服务端部署包构建
#
# 手动触发，产出可直接在 Linux 服务器运行的部署包：
#   - maozi-scan-server-linux-amd64 / arm64 （Go 二进制）
#   - dist/ （Web 前端静态文件）
#   - deploy.sh （一键启动脚本）
#
# 触发方式：GitHub 仓库 → Actions → Server Build → Run workflow

name: Server Build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Server Package
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ---- 构建 Web 前端 ----
      - name: Build Web frontend
        working-directory: ./web
        run: |
          npm ci || npm install
          npm run build

      # ---- 编译 Go 后端（Linux amd64 + arm64）----
      - name: Build Go server
        working-directory: ./server
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o ../out/maozi-scan-server-linux-amd64 cmd/server/main.go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o ../out/maozi-scan-server-linux-arm64 cmd/server/main.go

      # ---- 组装部署包 ----
      - name: Assemble package
        run: |
          mkdir -p out/dist
          cp -r web/dist/* out/dist/

          cat > out/deploy.sh << 'EOF'
          #!/bin/bash
          # Maozi-Ip-Scan 服务端一键启动脚本
          #
          # 用法（在解压后的目录里）:
          #   chmod +x deploy.sh maozi-scan-server-linux-*
          #   ./deploy.sh [端口]        # 默认 8080
          #
          # 服务器防火墙需放行对应端口；局域网设备浏览器访问 http://服务器IP:8080

          set -e
          PORT="${1:-8080}"
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)  BIN=maozi-scan-server-linux-amd64 ;;
            aarch64) BIN=maozi-scan-server-linux-arm64 ;;
            *) echo "不支持的架构: $ARCH"; exit 1 ;;
          esac

          echo "🐱 启动 Maozi-Ip-Scan 服务端 (架构: $ARCH, 端口: $PORT)"
          exec "./$BIN" -addr ":$PORT" -web ./dist -history ./data/history.json -notes ./data/notes.json -conn-file ./data/connections.json
          EOF
          chmod +x out/deploy.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maozi-scan-server
          path: out/
          retention-days: 90
